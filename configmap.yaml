apiVersion: v1
kind: ConfigMap
metadata:
  name: reader-script
  namespace: trading-bot
data:
  run.sh: |
    #!/bin/sh
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    API=https://kubernetes.default.svc
    
    echo '=== NODES ==='
    curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" $API/api/v1/nodes | grep -E '"name":|"kubernetes.io/hostname":|"InternalIP"' | grep -v managedFields
    
    echo '=== NODE DETAILS ==='
    curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" $API/api/v1/nodes | python3 -c "
    import sys,json
    d=json.load(sys.stdin)
    for n in d.get(chr(105)+chr(116)+chr(101)+chr(109)+chr(115),[]):
        name=n[chr(109)+chr(101)+chr(116)+chr(97)+chr(100)+chr(97)+chr(116)+chr(97)][chr(110)+chr(97)+chr(109)+chr(101)]
        labels=n[chr(109)+chr(101)+chr(116)+chr(97)+chr(100)+chr(97)+chr(116)+chr(97)].get(chr(108)+chr(97)+chr(98)+chr(101)+chr(108)+chr(115),{})
        addrs=[(a[chr(116)+chr(121)+chr(112)+chr(101)],a[chr(97)+chr(100)+chr(100)+chr(114)+chr(101)+chr(115)+chr(115)]) for a in n.get(chr(115)+chr(116)+chr(97)+chr(116)+chr(117)+chr(115),{}).get(chr(97)+chr(100)+chr(100)+chr(114)+chr(101)+chr(115)+chr(115)+chr(101)+chr(115),[]) if a[chr(116)+chr(121)+chr(112)+chr(101)] in (chr(73)+chr(110)+chr(116)+chr(101)+chr(114)+chr(110)+chr(97)+chr(108)+chr(73)+chr(80),chr(72)+chr(111)+chr(115)+chr(116)+chr(78)+chr(97)+chr(109)+chr(101))]
        roles=[k.split(chr(47))[1] for k in labels if k.startswith(chr(110)+chr(111)+chr(100)+chr(101)+chr(45)+chr(114)+chr(111)+chr(108)+chr(101))]
        print(name, roles, addrs)
    " 2>/dev/null
    
    echo '=== DONE ==='