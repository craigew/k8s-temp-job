apiVersion: batch/v1
kind: Job
metadata:
  name: ssh-grafana-v2
  namespace: trading-bot
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: default
      containers:
      - name: reader
        image: alpine/curl:latest
        command: ["sh", "/scripts/run.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      restartPolicy: Never
      volumes:
      - name: scripts
        configMap:
          name: host-explore-script
          defaultMode: 0755
  backoffLimit: 0
