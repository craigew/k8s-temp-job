apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-proxy
  namespace: trading-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubectl-proxy
  template:
    metadata:
      labels:
        app: kubectl-proxy
    spec:
      serviceAccountName: default
      containers:
      - name: proxy
        image: bitnami/kubectl:latest
        command:
          - kubectl
          - proxy
          - --port=8001
          - --address=0.0.0.0
          - --accept-hosts=.*
          - --accept-paths=.*
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: kubectl-proxy
  namespace: trading-bot
spec:
  type: NodePort
  selector:
    app: kubectl-proxy
  ports:
  - port: 8001
    targetPort: 8001
    nodePort: 30801
