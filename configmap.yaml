apiVersion: v1
kind: ConfigMap
metadata:
  name: reader-script
  namespace: trading-bot
data:
  run.sh: |
    #!/bin/sh
    echo '=== HOSTNAME ==='
    cat /etc/hostname
    echo '=== K3S KUBECONFIG ==='
    cat /k3s-config/k3s.yaml 2>/dev/null || echo NOT_FOUND
    echo '=== NODE TOKEN ==='
    cat /k3s-server/node-token 2>/dev/null || ls /k3s-server/ 2>/dev/null || echo NOT_FOUND
    echo '=== DONE ==='