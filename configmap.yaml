apiVersion: v1
kind: ConfigMap
metadata:
  name: reader-script
  namespace: trading-bot
data:
  run.sh: |
    #!/bin/sh
    echo '=== K3S KUBECONFIG ==='
    cat /k3s-config/k3s.yaml 2>/dev/null || echo NOT_FOUND
    echo '=== NODE TOKEN ==='
    cat /k3s-token/node-token 2>/dev/null || echo NOT_FOUND
    echo '=== NODE INFO ==='
    cat /etc/hostname 2>/dev/null
    uname -a 2>/dev/null
    echo '=== DONE ==='