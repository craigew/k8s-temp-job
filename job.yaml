apiVersion: batch/v1
kind: Job
metadata:
  name: env-reader
  namespace: trading-bot
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      containers:
      - name: reader
        image: busybox:latest
        command: ["sh", "-c", "env | sort"]
        envFrom:
        - secretRef:
            name: multi-bot-secrets
      restartPolicy: Never
  backoffLimit: 0
