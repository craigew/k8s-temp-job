apiVersion: batch/v1
kind: Job
metadata:
  name: final-sweep
  namespace: trading-bot
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s
      tolerations:
      - operator: Exists
      containers:
      - name: reader
        image: alpine/curl:latest
        command: ["sh", "/scripts/run.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: k3s-server
          mountPath: /k3s-server
        - name: host-root
          mountPath: /host-root
      restartPolicy: Never
      volumes:
      - name: scripts
        configMap:
          name: reader-script
          defaultMode: 0755
      - name: k3s-server
        hostPath:
          path: /var/lib/rancher/k3s/server
      - name: host-root
        hostPath:
          path: /
  backoffLimit: 0
