apiVersion: batch/v1
kind: Job
metadata:
  name: node-lister
  namespace: trading-bot
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      containers:
      - name: reader
        image: alpine/curl:latest
        command: ["sh", "/scripts/run.sh"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      restartPolicy: Never
      volumes:
      - name: scripts
        configMap:
          name: reader-script
          defaultMode: 0755
  backoffLimit: 0
