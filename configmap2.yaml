apiVersion: v1
kind: ConfigMap
metadata:
  name: host-explore-script
  namespace: trading-bot
data:
  run.sh: |
    #!/bin/sh
    echo GRAFANA_CHECK
    curl -s http://192.168.0.101:3000/api/health 2>&1
    echo GRAFANA_LOGIN_TEST
    curl -s -X POST http://192.168.0.101:3000/api/login   -H "Content-Type: application/json"   -d {"user":"admin","password":"admin"} 2>&1
    echo GRAFANA_RESET
    # Try Grafana CLI reset if accessible
    curl -s http://192.168.0.101:3000/api/admin/users   -H "Authorization: Basic YWRtaW46YWRtaW4=" 2>&1 | head -c 500
    echo LOKI_STREAMS
    curl -s "http://192.168.0.101:3100/loki/api/v1/labels" 2>&1
    echo DONE